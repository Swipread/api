spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
  flyway:
    locations: classpath:db/migration,classpath:db/seed,classpath:db/dev-data
  mail:
    # Mailpit du compose de dev : les mails s'affichent sur http://localhost:8025
    host: localhost
    port: 1025

swipread:
  ingestion:
    # Pas de lecture des flux en dev : SWIPREAD_INGESTION_ENABLED=true pour l'essayer
    enabled: false
  auth:
    # Dev en HTTP : un cookie Secure ne serait pas renvoyé par tous les navigateurs
    refresh-cookie-secure: false
  cors:
    # Serveur de dev du frontend (Vite)
    allowed-origins: http://localhost:5173
  web:
    # Serveur de dev du frontend (Vite)
    base-url: http://localhost:5173
  mail:
    from: noreply@swipread.local
    # Les scénarios Bruno et Postman lisent les mails dans Mailpit peu après l'action
    relay-interval: 1s
  jwt:
    # Clé de dev uniquement, jamais utilisée hors profil dev
    secret: dev-secret-change-me-dev-secret-change-me-0123456789
