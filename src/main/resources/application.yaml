spring:
  application:
    name: swipread-api
  profiles:
    group:
      dev: mock-reco
      test: mock-reco
  docker:
    compose:
      enabled: false
  datasource:
    hikari:
      # Les bornes de partition et les dates sans fuseau du DDL sont interprétées en UTC
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true
  mail:
    # Serveur mail de l'infra (service compose `mail`), sur le réseau interne, sans authentification
    host: ${SWIPREAD_MAIL_HOST:mail}
    port: ${SWIPREAD_MAIL_PORT:587}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      # Domaine du Message-ID (sinon le nom aléatoire du conteneur)
      mail.from: ${swipread.mail.from}
  servlet:
    multipart:
      # Aucun upload : sans analyse multipart, aucune donnée de l'utilisateur n'atteint le décodeur Base64 de
      # ContentDisposition avant l'authentification (CVE-2026-114938)
      enabled: false

springdoc:
  default-produces-media-type: application/json

management:
  health:
    mail:
      # Un serveur mail injoignable ne rend pas l'API indisponible (les mails attendent dans app.mail_outbox) ;
      # sans cela, /actuator/health passerait DOWN et un déploiement serait annulé
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

swipread:
  jwt:
    secret: ${SWIPREAD_JWT_SECRET}
    # Access token court : il est renouvelé par le refresh token (cookie)
    ttl: 15m
  auth:
    refresh-ttl: 30d
    refresh-grace: 10s
    refresh-cookie-secure: true
  cors:
    # Liste séparée par des virgules ; vide par défaut
    allowed-origins: ${SWIPREAD_CORS_ALLOWED_ORIGINS:}
  reco:
    base-url: ${SWIPREAD_RECO_URL:http://localhost:8081}
    timeout: 300ms
  feed:
    page-size: 10
    stock-size: 50
    refill-threshold: 20
  mail:
    # Adresse d'expédition ; son domaine doit être celui du serveur mail (ALLOWED_SENDER_DOMAINS, DKIM)
    from: ${SWIPREAD_MAIL_FROM}
    from-name: Swipread
    relay-interval: 5s
  ingestion:
    # Lecture des flux des sources actives qui ont des thèmes (contrat v1.5) ; coupée en dev et en test
    enabled: ${SWIPREAD_INGESTION_ENABLED:true}
    interval: 15m
    initial-delay: 1m
    max-age: 7d
    max-new-per-source: 30
    user-agent: "SwipreadBot/1.0 (+https://github.com/Swipread/api)"
