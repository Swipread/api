spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

swipread:
  ingestion:
    # Les tests lancent l'ingestion eux-mêmes
    enabled: false
  auth:
    refresh-cookie-secure: false
  cors:
    # Serveur de dev du frontend (Vite)
    allowed-origins: http://localhost:5173
  web:
    base-url: https://swipread.test
  mail:
    # Le serveur SMTP (Mailpit) est un conteneur de test : voir TestcontainersConfiguration
    from: noreply@swipread.test
    relay-interval: 200ms
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-0123
  sources:
    # Les tests d'intégration servent leurs flux depuis localhost, sur un port aléatoire
    allow-local-feeds: true
