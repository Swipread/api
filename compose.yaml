services:
  postgres:
    image: 'pgvector/pgvector:pg17'
    labels:
      # Image non reconnue automatiquement par Spring Boot
      org.springframework.boot.service-connection: postgres
    environment:
      - 'POSTGRES_DB=swipread'
      - 'POSTGRES_USER=swipread'
      - 'POSTGRES_PASSWORD=swipread'
    ports:
      - '5432'
  redis:
    image: 'redis:7.4'
    ports:
      - '6379'
  # Faux serveur mail : reçoit tout sans rien envoyer ; interface sur http://localhost:8025
  mailpit:
    image: 'axllent/mailpit:v1.33.0'
    ports:
      - '1025:1025'
      - '8025:8025'
